[package]
name = "paws-gui"
version = "1.2.2"
edition = "2024"
description = "PAWS Answers Web Sessions: a small static file web server with optional PHP support."
license = "MIT"
homepage = "https://github.com/Cristiandis/PAWS"

[package.metadata.generate-rpm]
name = "paws"
release = "1"
require-sh = false

assets = [
    { source = "target/release/paws", dest = "/usr/bin/paws", mode = "755" },
    { source = "target/release/paws-gui", dest = "/usr/bin/paws-gui", mode = "755" },
    { source = "php-runtime/php/php-fpm", dest = "/usr/lib/paws/php/php-fpm", mode = "755" },
    { source = "php-runtime/php/php.ini", dest = "/usr/lib/paws/php/php.ini", mode = "644" },
    { source = "packaging/paws-gui.desktop", dest = "/usr/share/applications/paws-gui.desktop", mode = "644" },
    { source = "packaging/icons/16x16.png", dest = "/usr/share/icons/hicolor/16x16/apps/paws-gui.png", mode = "644" },
    { source = "packaging/icons/32x32.png", dest = "/usr/share/icons/hicolor/32x32/apps/paws-gui.png", mode = "644" },
    { source = "packaging/icons/48x48.png", dest = "/usr/share/icons/hicolor/48x48/apps/paws-gui.png", mode = "644" },
    { source = "packaging/icons/64x64.png", dest = "/usr/share/icons/hicolor/64x64/apps/paws-gui.png", mode = "644" },
    { source = "packaging/icons/128x128.png", dest = "/usr/share/icons/hicolor/128x128/apps/paws-gui.png", mode = "644" },
    { source = "packaging/icons/256x256.png", dest = "/usr/share/icons/hicolor/256x256/apps/paws-gui.png", mode = "644" },
]

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
paws = { path = "../paws" }
rfd = "0.15"
open = "5"
egui-i18n = "0.2"
toml = "1.1.8"
