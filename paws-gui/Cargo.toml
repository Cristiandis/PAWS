[package]
name = "paws-gui"
version = "1.1.2"
edition = "2024"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = [
    "default_fonts",
    "persistence",
    "wgpu",
    "wayland",
    "x11",
] }
paws = { path = "../paws" }
rfd = "0.15"
open = "5"
egui-i18n = "0.2"
toml = "1.1.8"
